# ==================================================
# Application
# ==================================================
spring.application.name=learning-platform-backend
server.port=8080

# ==================================================
# MySQL DataSource
# ==================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/learning_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================================================
# JPA / Hibernate
# ==================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==================================================
# JWT
# ==================================================
app.jwt.secret=${JWT_SECRET:my-super-secret-jwt-key-change-this-in-production-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Optional initial administrator bootstrap.
app.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.admin.bootstrap.name=${ADMIN_BOOTSTRAP_NAME:}
app.admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}

# ==================================================
# CORS
# ==================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ==================================================
# Logging
# ==================================================
logging.level.root=INFO
logging.level.com.learningplatform.backend=DEBUG

# ==================================================
# Swagger
# ==================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# ==================================================
# Mail Configuration (Gmail SMTP)
# ==================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# ==================================================
# OTP Security Policies (4 digits, 5 min expiry, 3s cooldown)
# ==================================================
app.otp.expiration-minutes=5
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=3
app.otp.verification-token-expiration-minutes=15
app.mail.dev-simulation-enabled=${MAIL_DEV_SIMULATION:true}

# ==================================================
# AI Tutor Configuration: Gemini Primary + Groq Fallback
# ==================================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}
gemini.model=gemini-3.1-flash-lite
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:60}
gemini.max-tokens=${GEMINI_MAX_TOKENS:2048}

groq.api.key=${GROQ_API_KEY:}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1}
groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
groq.timeout-seconds=${GROQ_TIMEOUT_SECONDS:60}
groq.max-tokens=${GROQ_MAX_TOKENS:2048}

ai.fallback.enabled=true
ai.primary-provider=gemini
ai.fallback-provider=groq

app.ai.rate-limit-per-minute=15
app.ai.max-message-length=4000


